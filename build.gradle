// Copy mods.toml to classes dir so dev environment can find it
tasks.register('copyModsToml', Copy) {
    from layout.buildDirectory.dir('resources/main/META-INF')
    into layout.buildDirectory.dir('classes/java/main/META-INF')
}
tasks.named('processResources').configure { finalizedBy 'copyModsToml' }
classes.dependsOn copyModsToml

// 校验：neoforge.mods.toml 的 version 必须与 gradle.properties 的 mod_version 一致。
// 手写 toml + gradle 属性是两处版本号，漂了就会出现"jar 名与元数据版本不符"而没人发现。
tasks.register('checkModMetadata') {
    def tomlFile = layout.projectDirectory.file('src/main/resources/META-INF/neoforge.mods.toml')
    def expected = mod_version
    inputs.file(tomlFile)
    inputs.property('mod_version', expected)
    doLast {
        def text = tomlFile.asFile.getText('UTF-8')
        if (!(text =~ /(?m)^\s*version\s*=\s*"\Q${expected}\E"\s*$/)) {
            throw new GradleException("neoforge.mods.toml 的 version 与 gradle.properties 的 mod_version(${expected}) 不一致")
        }
    }
}
tasks.named('processResources') { dependsOn 'checkModMetadata' }

// Allow duplicate META-INF/neoforge.mods.toml from classes and resources。
// 作用域收窄到 jar 本身（原来用 withType(Jar)，会连带影响将来任何 Jar 任务）；
// 同时打开可复现构建：去掉条目时间戳、锁定文件顺序，让同样的源码产出字节相同的 jar。
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
